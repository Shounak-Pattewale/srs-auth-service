[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srs-auth-service"
version = "0.1.0"
description = "Standalone authentication utilities for Python"
readme = "README.md"
authors = [
    {name = "Shounak Pattewale"},
]
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyJWT>=2.12.1",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.3",
]
flask = [
    "Flask>=3.1.3",
    "Flask-Login>=0.6.3",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Shounak-Pattewale/srs-auth-service"
Documentation = "https://github.com/Shounak-Pattewale/srs-auth-service#readme"
Repository = "https://github.com/Shounak-Pattewale/srs-auth-service.git"
"Bug Tracker" = "https://github.com/Shounak-Pattewale/srs-auth-service/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
